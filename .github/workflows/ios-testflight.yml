# iOS build -> App Store Connect / TestFlight, on GitHub's hosted Macs.
# Adapted from Stack'd Finance's workflow of the same name.
#
# Why this exists: there is no Mac on the team, and Apple requires a recent
# Xcode (macOS only) for every upload. macOS runners are free on a public
# repository.
#
# Which Xcode: from April 2027 Apple accepts only builds made with the iOS 27
# SDK (Xcode 27) or later, and warned about it on every upload made with
# Xcode 26 (ITMS-90725, builds 11 and 12). So:
# - `runs-on` is GitHub's image that ships Xcode 27;
# - the newest released Xcode on it is selected, never a beta or a release
#   candidate (Apple refuses uploads built with those);
#   the selection follows the image's links to the real app (build 14 got a
#   beta through a plain-named link);
# - the job fails at once if the iOS SDK is older than MIN_IOS_SDK.
# Apple raises this floor every spring. When the warning comes back for the
# next SDK, change `runs-on` to the image that ships that Xcode and raise
# MIN_IOS_SDK; nothing else here names a version.
#
# MANUAL ONLY (workflow_dispatch). The repository is public, so there is
# deliberately no push / pull_request trigger: nothing a fork or a pull request
# does can reach the signing secrets. Only people with write access can start a
# run (Actions tab > iOS to TestFlight > Run workflow).
#
# Unlike Finance, ios/ is not committed: the Xcode project is generated here by
# `npx cap add ios`, then the version, build number, icons and the encryption
# declaration are applied to it.
#
# Signing: Apple's cloud-managed distribution certificate, reached through an
# App Store Connect API key with the ADMIN role (an App Manager key archives,
# then export fails with "Cloud signing permission error"). The team key that
# Stack'd Finance uses works here too. Secrets (Settings > Secrets and
# variables > Actions > New repository secret):
#   APPSTORE_API_KEY_ID      Key ID
#   APPSTORE_API_ISSUER_ID   Issuer ID
#   APPSTORE_API_KEY_P8      full contents of AuthKey_XXXXXXXXXX.p8
#
# First run: leave "upload" unticked. It builds, signs and INSPECTS the .ipa
# without sending anything to Apple. Tick "upload" once that is green.
name: iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to App Store Connect (leave off for a dry run that only builds, signs and checks)'
        type: boolean
        default: false
      build_number:
        description: 'Build number override. Empty = this workflow''s run number, which always goes up. Apple rejects a build number it has already seen for the same version.'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    # GitHub's Xcode 27 image (macOS 27). It is still labelled "preview" in
    # actions/runner-images (issue 14404): runs may queue for longer.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      MIN_IOS_SDK: '27'
      TEAM_ID: YA3DTZR26U
      BUNDLE_ID: com.eugeniocalva.stackd
      WORKSPACE: ios/App/App.xcworkspace
      SCHEME: App
    steps:
      - uses: actions/checkout@v5

      # The `runner` context does not exist at job level, so the temp paths are
      # set here and exported to every later step. The version is the one the
      # web app ships (sw.js VERSION 'stackd-v1.4.3' -> 1.4.3).
      - name: Paths, version and build number
        env:
          BUILD_INPUT: ${{ inputs.build_number }}
        run: |
          echo "ARCHIVE=$RUNNER_TEMP/App.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_DIR=$RUNNER_TEMP/export" >> "$GITHUB_ENV"
          echo "KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
          version="$(sed -n "s/^const VERSION = 'stackd-v\([0-9.]*\)';.*/\1/p" sw.js)"
          [ -n "$version" ] || { echo "::error::could not read the version from sw.js"; exit 1; }
          build="${BUILD_INPUT:-$GITHUB_RUN_NUMBER}"
          case "$build" in ''|*[!0-9]*) echo "::error::build number must be digits, got '$build'"; exit 1 ;; esac
          echo "version $version, build $build"
          echo "WANT_VERSION=$version" >> "$GITHUB_ENV"
          echo "WANT_BUILD=$build" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Select the newest released Xcode
        run: |
          ls -d /Applications/Xcode_*.app
          # The real app behind each name: the image links plain names to betas
          # (build 14 got Xcode_27.3.app -> Xcode_27.3_beta.app), so a filter on
          # the names alone is not enough.
          XCODE="$(for x in /Applications/Xcode_*.app; do (cd "$x" && pwd -P); done | grep -Eiv 'beta|_rc|release_candidate|preview' | sort -uV | tail -n 1)"
          [ -n "$XCODE" ] || { echo "::error::no released Xcode on this image"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK $SDK"
          [ "${SDK%%.*}" -ge "$MIN_IOS_SDK" ] || { echo "::error::iOS SDK $SDK is older than $MIN_IOS_SDK, which Apple requires (ITMS-90725). Use an image with a newer Xcode in runs-on."; exit 1; }

      - name: Check the secrets are present
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          missing=0
          [ -n "$KEY_ID" ] || { echo "::error::secret APPSTORE_API_KEY_ID is not set"; missing=1; }
          [ -n "$ISSUER_ID" ] || { echo "::error::secret APPSTORE_API_ISSUER_ID is not set"; missing=1; }
          case "$KEY_P8" in
            *"BEGIN PRIVATE KEY"*"END PRIVATE KEY"*) ;;
            "") echo "::error::secret APPSTORE_API_KEY_P8 is not set"; missing=1 ;;
            *) echo "::error::APPSTORE_API_KEY_P8 does not look like a .p8 file - paste the whole file, BEGIN and END lines included"; missing=1 ;;
          esac
          exit $missing

      - name: Install dependencies
        run: npm ci

      # Date maths, reminders, store rules, sanitiser, precache list and the
      # file:// bundle: the same gate as a local commit.
      - name: Gates (npm run check)
        run: npm run check

      - name: Build the web assets into www/
        run: npm run build

      - name: Generate the iOS project
        run: npx cap add ios --packagemanager CocoaPods

      - name: App icon and splash screens
        run: |
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#ec3013' \
            --splashBackgroundColor '#f4f7f9' \
            --splashBackgroundColorDark '#0b0f19'

      - name: Sync web assets and plugins (pod install)
        run: npx cap sync ios

      # The keyboard resizes the web view ("resize": "native"), and on iOS 26
      # it floats with rounded corners: around it the window shows, black by
      # default (owner's review 2026-11-17). The window and the root view get
      # the app's background instead. Build 11 took light or dark from the
      # phone, so a light app on a dark phone still showed dark around the
      # keyboard (owner's review of build 11): the window now takes the app's
      # own setting, which src/theme.js sends to the "stackdTheme" handler
      # ('light' | 'dark' | 'system'; 'system' leaves it to the phone).
      - name: Window background and theme behind the keyboard
        run: |
          F=ios/App/App/AppDelegate.swift
          grep -q 'didFinishLaunchingWithOptions' "$F" || { echo "::error::AppDelegate.swift has no didFinishLaunchingWithOptions - the Capacitor template changed"; exit 1; }
          grep -q '^import Capacitor' "$F" || { echo "::error::AppDelegate.swift does not import Capacitor - the Capacitor template changed"; exit 1; }
          perl -0pi -e 's/^import UIKit\n/import UIKit\nimport WebKit\n/m; s/(didFinishLaunchingWithOptions[^{]*\{\n)/$1        DispatchQueue.main.async { StackdTheme.attach() }   \/\/ Stack\x27d: the app\x27s theme around the keyboard\n/' "$F"
          cat >> "$F" <<'SWIFT'

          // Stack'd (owner's review of builds 10 and 11): the keyboard resizes the
          // web view and, on iOS 26, floats with rounded corners, so the window
          // shows around it. The window gets the app's background, and the app's
          // light or dark rather than the phone's: theme.js sends its setting to
          // the "stackdTheme" handler, and is asked for it here in case it was
          // sent before the handler existed.
          final class StackdTheme: NSObject, WKScriptMessageHandler {
              static let shared = StackdTheme()
              static let background = UIColor { $0.userInterfaceStyle == .dark
                  ? UIColor(red: 11 / 255.0, green: 15 / 255.0, blue: 25 / 255.0, alpha: 1)
                  : UIColor(red: 244 / 255.0, green: 247 / 255.0, blue: 249 / 255.0, alpha: 1) }

              static var windows: [UIWindow] {
                  UIApplication.shared.connectedScenes.compactMap { $0 as? UIWindowScene }.flatMap { $0.windows }
              }

              static func attach() {
                  for w in windows {
                      w.backgroundColor = background
                      w.rootViewController?.view.backgroundColor = background
                      guard let web = (w.rootViewController as? CAPBridgeViewController)?.webView else { continue }
                      let scripts = web.configuration.userContentController
                      scripts.removeScriptMessageHandler(forName: "stackdTheme")
                      scripts.add(shared, name: "stackdTheme")
                      web.evaluateJavaScript("document.documentElement.dataset.themeSetting || ''") { value, _ in
                          if let setting = value as? String { apply(setting) }
                      }
                  }
              }

              /// 'light' | 'dark' | 'system'; anything else is ignored.
              static func apply(_ setting: String) {
                  let style: UIUserInterfaceStyle
                  switch setting {
                  case "light": style = .light
                  case "dark": style = .dark
                  case "system": style = .unspecified
                  default: return
                  }
                  for w in windows { w.overrideUserInterfaceStyle = style }
              }

              func userContentController(_ controller: WKUserContentController, didReceive message: WKScriptMessage) {
                  if let setting = message.body as? String { StackdTheme.apply(setting) }
              }
          }
          SWIFT
          grep -q '^import WebKit' "$F" && grep -q 'StackdTheme.attach()' "$F" && grep -q 'class StackdTheme' "$F" \
            || { echo "::error::could not add the window theme to AppDelegate.swift"; exit 1; }
          sed -n '1,/return true/p' "$F"

      - name: Check the native plugins landed
        run: |
          grep -q "CapacitorLocalNotifications" ios/App/Podfile \
            || { echo "::error::@capacitor/local-notifications is missing from the Podfile - reminders would not work"; exit 1; }
          grep -q "CapacitorKeyboard" ios/App/Podfile \
            || { echo "::error::@capacitor/keyboard is missing from the Podfile - the add sheet would scroll under the keyboard"; exit 1; }
          grep -q "CapacitorHaptics" ios/App/Podfile \
            || { echo "::error::@capacitor/haptics is missing from the Podfile - long-press would not vibrate"; exit 1; }
          grep -q "StackdRecordingService" ios/App/Podfile \
            || { echo "::error::plugins/recording-service is missing from the Podfile - it is a file: dependency, run npm ci"; exit 1; }
          grep -q "CapawesomeCapacitorAgeSignals" ios/App/Podfile \
            || { echo "::error::@capawesome/capacitor-age-signals is missing from the Podfile - the store age signal would not be read"; exit 1; }

      # Apple's Declared Age Range needs the com.apple.developer.declared-age-range
      # entitlement (docs/prd-age-signals.md, D-7). Signing fails if the App ID
      # does not have the capability, so it is added only once the owner has
      # turned the capability on in the developer portal and set the
      # repository variable IOS_DECLARED_AGE_RANGE to true. Without it the app
      # still builds; on iOS the store simply gives no age, and the birth-year
      # question stays.
      - name: Declared Age Range entitlement (when enabled)
        if: ${{ vars.IOS_DECLARED_AGE_RANGE == 'true' }}
        run: |
          E=ios/App/App/App.entitlements
          P=ios/App/App.xcodeproj/project.pbxproj
          [ -f "$E" ] || printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0">' '<dict>' '</dict>' '</plist>' > "$E"
          /usr/libexec/PlistBuddy -c 'Add :com.apple.developer.declared-age-range bool true' "$E" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c 'Set :com.apple.developer.declared-age-range true' "$E"
          grep -q 'CODE_SIGN_ENTITLEMENTS' "$P" \
            || perl -0pi -e 's/(\n(\t+)INFOPLIST_FILE = App\/Info\.plist;)/\n$2CODE_SIGN_ENTITLEMENTS = App\/App.entitlements;$1/g' "$P"
          [ "$(grep -c 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;' "$P")" -ge 2 ] \
            || { echo "::error::could not point the App target at App.entitlements"; exit 1; }
          cat "$E"

      # HTTPS only, no custom encryption: without this key every build waits in
      # TestFlight as "Missing Compliance" until it is answered by hand.
      - name: Declare export compliance
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

      # Meetings (1.5.0, PRD AC-04.3 / AC-11.5): the microphone usage string
      # Apple shows with the permission prompt, and the audio background mode
      # that keeps a recording running while the screen is locked.
      - name: Microphone usage string and background audio
        run: |
          PLIST=ios/App/App/Info.plist
          DESC="The app records a meeting only when you tap Record, so you can play it back and transcribe it."
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription $DESC" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string $DESC" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"

      - name: Install the API key and a build keychain
        env:
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          mkdir -p "$(dirname "$KEY_PATH")"
          umask 077
          printf '%s\n' "$KEY_P8" > "$KEY_PATH"
          # A throwaway, unlocked keychain for anything Xcode needs to create
          # while signing. Deleted in the last step.
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "::add-mask::$KC_PASS"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # The archive is not signed. Signing it made Xcode ask Apple for a new
      # Apple Development certificate on every run (each run is a new machine),
      # until the account reached its limit and build 16 failed with "Your
      # account has reached the maximum number of certificates". The export
      # step below signs the app with the cloud-managed distribution
      # certificate, the only signature a store build needs; "Check the signed
      # .ipa" then proves it is there.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$WANT_VERSION" CURRENT_PROJECT_VERSION="$WANT_BUILD" | tail -n 200

      - name: Check the archive
        run: |
          APP="$ARCHIVE/Products/Applications/App.app"
          got_id="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          got_version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")"
          got_build="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")"
          enc="$(/usr/libexec/PlistBuddy -c 'Print ITSAppUsesNonExemptEncryption' "$APP/Info.plist" 2>/dev/null || echo absent)"
          echo "$got_id $got_version ($got_build), ITSAppUsesNonExemptEncryption=$enc"
          [ "$got_id" = "$BUNDLE_ID" ] || { echo "::error::bundle id $got_id != $BUNDLE_ID"; exit 1; }
          [ "$got_version" = "$WANT_VERSION" ] || { echo "::error::archived version $got_version != $WANT_VERSION"; exit 1; }
          [ "$got_build" = "$WANT_BUILD" ] || { echo "::error::archived build $got_build != $WANT_BUILD"; exit 1; }
          [ "$enc" = "false" ] || { echo "::error::ITSAppUsesNonExemptEncryption is not false"; exit 1; }
          mic="$(/usr/libexec/PlistBuddy -c 'Print NSMicrophoneUsageDescription' "$APP/Info.plist" 2>/dev/null || echo absent)"
          bg="$(/usr/libexec/PlistBuddy -c 'Print UIBackgroundModes:0' "$APP/Info.plist" 2>/dev/null || echo absent)"
          echo "NSMicrophoneUsageDescription: $mic; UIBackgroundModes[0]: $bg"
          [ "$mic" != "absent" ] || { echo "::error::NSMicrophoneUsageDescription is missing - iOS would crash on the first recording"; exit 1; }
          [ "$bg" = "audio" ] || { echo "::error::UIBackgroundModes does not contain audio - recording would stop when the screen locks"; exit 1; }
          [ -f "$APP/public/index.html" ] && [ -f "$APP/public/src/ui/notes.js" ] \
            || { echo "::error::the web app is missing from the bundle"; exit 1; }
          echo "VERSION=$got_version" >> "$GITHUB_ENV"
          echo "BUILD=$got_build" >> "$GITHUB_ENV"

      - name: Export and sign the .ipa (no upload)
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist scripts/ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" | tail -n 100

      - name: Check the signed .ipa
        run: |
          IPA="$(ls "$EXPORT_DIR"/*.ipa | head -n 1)"
          [ -f "$IPA" ] || { echo "::error::no .ipa was exported"; exit 1; }
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP="$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app | head -n 1)"
          codesign -dvv "$APP" 2>&1 | grep -E '^Authority=' | head -n 3
          codesign -dvv "$APP" 2>&1 | grep -q 'Authority=Apple Distribution' \
            || { echo "::error::the app is not signed with an Apple Distribution certificate"; exit 1; }
          ENTS="$RUNNER_TEMP/entitlements.plist"
          codesign -d --entitlements "$ENTS" --xml "$APP" 2>/dev/null
          # A store build must not be debuggable.
          gta="$(plutil -extract get-task-allow raw -o - "$ENTS" 2>/dev/null || echo absent)"
          echo "get-task-allow: $gta"
          [ "$gta" != "true" ] || { echo "::error::get-task-allow is true - this is a development-signed build"; exit 1; }
          ls "$APP"/AppIcon*.png >/dev/null 2>&1 \
            || { echo "::error::no app icon in the bundle - App Store Connect would reject the upload"; exit 1; }
          echo "ipa OK: $(du -h "$IPA" | cut -f1), version $VERSION build $BUILD"

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -o pipefail
          cp scripts/ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions-upload.plist"
          /usr/libexec/PlistBuddy -c 'Set :destination upload' "$RUNNER_TEMP/ExportOptions-upload.plist"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$RUNNER_TEMP/upload" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" | tail -n 100

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### iOS build"
            echo "- version: \`${VERSION:-?}\`, build: \`${BUILD:-?}\`"
            if [ "${{ job.status }}" != "success" ]; then
              echo "- **failed**: open the red step above for the error; nothing was sent to Apple unless the upload step ran"
            elif [ "${{ inputs.upload }}" = "true" ]; then
              echo "- upload requested: check App Store Connect > TestFlight; processing takes a few minutes to an hour"
            else
              echo "- dry run: built, signed and checked, nothing sent to Apple"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key and the keychain
        if: ${{ always() }}
        run: |
          rm -f "$KEY_PATH"
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
