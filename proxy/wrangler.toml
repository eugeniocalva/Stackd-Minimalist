# Stack'd Meetings proxy (docs/architecture.md §20). Deployed by
# .github/workflows/proxy.yml; secrets are set once with `wrangler secret put`
# (see README.md), never written here.
name = "stackd-proxy"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Per-subscriber counters (pool:…), the entitlement cache (rccache:…).
# Create it once: `wrangler kv namespace create POOL`, then paste the id.
[[kv_namespaces]]
binding = "POOL"
id = "5db8ec1359f04d0281e126e1d0948147"

[vars]
# Origins the web app is served from; the shells send capacitor:// (iOS)
# and http://localhost (Android). Comma-separated.
ALLOWED_ORIGINS = "https://eugeniocalva.github.io,capacitor://localhost,ionic://localhost,http://localhost,http://localhost:8123,http://localhost:8124"
# Minutes model (PRD-meetings Q15: the Phase 16 benchmark picks between the
# small and mid tiers; the mid tier is the fallback).
SUMMARY_MODEL = "claude-sonnet-5-5"
# Speech-to-text provider for Transcribe (PRD-meetings Q13: the benchmark in
# benchmark/stt.mjs picks; 'assemblyai' needs the ASSEMBLYAI_API_KEY secret).
STT_PROVIDER = "assemblyai"
# Subscriber ids (Settings › Meetings & AI shows them) that get the tester
# allowance (60 audio minutes + 10 summaries a day) without a purchase.
TESTERS = "r6j0e59ndjn942d4"

[observability]
enabled = true
