# Stack'd Meetings proxy (docs/architecture.md §20). Deployed by
# .github/workflows/proxy.yml; secrets are set once with `wrangler secret put`
# (see README.md), never written here.
name = "stackd-proxy"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# Served on https://minimalist-api.stackdplatform.com (src/store.js PROXY_URL): a
# custom domain on the stackdplatform.com zone in this account, so its certificate
# comes from the zone. The workers.dev address stays on as a fallback, but on
# 2026-10-20 the account's workers.dev subdomain had no certificate at the edge.
# No per-version preview URLs: every deployed version would be reachable on its own address.
routes = [{ pattern = "minimalist-api.stackdplatform.com", custom_domain = true }]
workers_dev = true
preview_urls = false

# Per-subscriber counters (pool:…), the entitlement cache (rccache:…).
# Create it once: `wrangler kv namespace create POOL`, then paste the id.
[[kv_namespaces]]
binding = "POOL"
id = "5db8ec1359f04d0281e126e1d0948147"

# Accounts and sync (1.6.0, docs/architecture.md Part IV). Off until the owner
# creates the database: every /v1/auth, /v1/account and /v1/sync route answers
# 503 'misconfigured' while DB, the two peppers, the document versions or mail
# are missing, and the 1.5.0 routes are unaffected. To turn it on:
#   npx wrangler d1 create stackd --jurisdiction=eu      # EU only; cannot be changed later
#   paste the id below and uncomment the block and the trigger
#   npx wrangler d1 migrations apply DB --remote
#   npx wrangler secret put PIN_PEPPER                   # 32+ random characters
#   npx wrangler secret put CODE_PEPPER                  # 32+ random characters, different
#   set TERMS_VERSION, PRIVACY_VERSION, OWNER_FOOTER and MAIL_PROVIDER in [vars]
# Mail (decision 60 of PRD 1.7.0): Brevo, for the whole Stack'd family.
#   in Brevo: add the domain stackdplatform.com under Senders, Domains and
#     IPs, and put the SPF, DKIM and DMARC records it shows in Cloudflare DNS
#   in Brevo: create an API key (SMTP & API > API keys)
#   in the Cloudflare dashboard (Workers > this Worker > Settings >
#     Variables and Secrets): add the secret BREVO_API_KEY
#   [vars] below already hold MAIL_PROVIDER, MAIL_FROM, MAIL_REPLY_TO and OWNER_FOOTER
# Accounts stay off (503) until the key and a stackdplatform.com sender are there.
# [[d1_databases]]
# binding = "DB"
# database_name = "stackd"
# database_id = "REPLACE_WITH_D1_DATABASE_ID"
# migrations_dir = "migrations"
#
# [triggers]
# crons = ["17 3 * * *"]   # the daily clean-up (src/retention.js)

[vars]
# Account emails (PRD-accounts US-09; PRD 1.7.0 decision 60 and the sender
# chosen with it): Brevo, from account@, replies to hi@, the studio's name
# and contact at the foot of each message. Unused until accounts are on.
MAIL_PROVIDER = "brevo"
MAIL_FROM = "Stack'd <account@stackdplatform.com>"
MAIL_REPLY_TO = "hi@stackdplatform.com"
OWNER_FOOTER = "Stack'd Development Studio · hi@stackdplatform.com"
# Origins the web app is served from: the new address (1.6.0) and the old
# GitHub Pages one, which keeps working for one release (PRD-accounts
# AC-12.2). The shells send capacitor://localhost (iOS) and
# https://localhost (Android: Capacitor 6 and later; http://localhost is
# what builds before 6 sent). Comma-separated. No localhost ports: a
# local server runs the Worker from wrangler.dev.toml, which lists its own
# (security review of 2026-11-16, docs/qa-report.md).
ALLOWED_ORIGINS = "https://app.stackdplatform.com,https://eugeniocalva.github.io,capacitor://localhost,ionic://localhost,https://localhost,http://localhost"
# Minutes model (PRD-meetings Q15: the Phase 16 benchmark picks between the
# small and mid tiers; the mid tier is the fallback).
SUMMARY_MODEL = "claude-sonnet-5-5"
# Speech-to-text provider for Transcribe (PRD-meetings Q13: the benchmark in
# benchmark/stt.mjs picks; 'assemblyai' needs the ASSEMBLYAI_API_KEY secret).
STT_PROVIDER = "assemblyai"
# Subscriber ids (Settings › Meetings & AI shows them) that get the tester
# allowance (60 audio minutes + 10 summaries a day) without a purchase.
TESTERS = "r6j0e59ndjn942d4,ywylzya5z5moe1qc"

[observability]
enabled = true
