# Codemagic CI/CD — Stack'd (Capacitor + vanilla web app)
#
# Before the first run, in the Codemagic UI:
#   1. Teams/App settings > Integrations > App Store Connect: add an API key
#      and name it exactly "StackdAppStoreKey" (or change the name below).
#   2. Ensure the bundle id com.eugeniocalva.stackd exists in App Store Connect.
# Codemagic then issues the signing certificate + provisioning profile itself.

workflows:

  # ── iOS: build a signed .ipa and ship it to TestFlight ────────────────
  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: StackdAppStoreKey
    environment:
      node: 24
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eugeniocalva.stackd
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.eugeniocalva.stackd"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web assets into www/
        script: npm run build

      - name: Add iOS platform if not committed
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync web assets + plugins into the native project
        script: npx cap sync ios

      - name: Generate app icons and splash screens
        script: |
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#ec3013' \
            --splashBackgroundColor '#f3f2f2' \
            --splashBackgroundColorDark '#201e1d'

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Set build number from the Codemagic build counter
        script: |
          cd ios/App
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Apply signing profiles to the Xcode project
        script: xcode-project use-profiles

      - name: Build the .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Flip to true only once the App Store listing (screenshots,
        # description, privacy answers) is complete in App Store Connect.
        submit_to_app_store: false
      email:
        recipients:
          - eugenio.calvaresi@gmail.com
        notify:
          success: true
          failure: true

  # ── Build-only check: no signing, no publishing ───────────────────────
  ios-debug:
    name: iOS debug build (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 24
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web assets into www/
        script: npm run build
      - name: Add iOS platform if not committed
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Compile without signing
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
